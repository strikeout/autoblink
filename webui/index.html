<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xdj-clock</title>
<!--
  The shared xdj-clock dashboard. The host, the emulator and the ESP32 serve this file.
  It speaks protocol v1 over one WebSocket at /ws (see host/src/web/mod.rs).
  The page shows only the panels that the server names in the "caps" of its hello message.
  Network text (deck names, track titles, log lines) goes into textContent, never innerHTML.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--panel:#12121c;--border:#1e1e32;--text:#e0e0e0;--muted:#7a7a8c;--dim:#4a4a5c;--accent:#00e0ff;--play:#00ff88;--flash:#ffd000;--danger:#ff4d4d;--warn:#ffaa00}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px}
.mono,.log,.num{font-family:'SF Mono',Menlo,Monaco,'Cascadia Mono',monospace}
header{background:#151524;padding:10px 16px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
header h1{font-size:15px;color:var(--accent)}
header .kv{color:var(--muted)}
header .kv b{color:var(--text);font-weight:500}
footer{padding:4px 16px 12px;text-align:center;font-size:11px;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--danger);display:inline-block;margin-right:6px}
.dot.on{background:var(--play)}
#state.play{color:var(--play)}#state.stop{color:var(--danger)}
#toast{margin-left:auto;color:var(--danger);font-weight:600}
main{padding:12px;display:grid;gap:12px;grid-template-columns:2fr 1fr;max-width:1600px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;min-width:0}
.panel h2{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.wide{grid-column:1/-1}
details.panel>summary{list-style:none;cursor:pointer;user-select:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary h2{justify-content:flex-start;gap:6px}
details.panel>summary h2::before{content:'▸';color:var(--dim);font-size:14px;letter-spacing:0}
details.panel[open]>summary h2::before{content:'▾'}
details.panel:not([open])>summary h2{margin-bottom:0}
[hidden]{display:none!important}
/* master */
#bpm{font-size:58px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;transition:color .05s}
#bpm.flash{color:var(--flash)}
.beats{display:flex;gap:6px;margin:6px 0 10px}
.beats span{width:22px;height:22px;border-radius:4px;background:#1c1c2c}
.beats span.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.beats.flash span.on{background:var(--flash);box-shadow:0 0 12px var(--flash)}
.row{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);margin-top:4px}
.row b{color:var(--text);font-weight:500}
.mgrid{display:flex;flex-wrap:wrap;gap:16px 32px}
.mgrid>div{flex:1 1 280px;min-width:0}
.pk{display:flex;align-items:center;gap:10px;min-height:38px}
#pkind{font-size:30px;font-weight:700;letter-spacing:1px;color:var(--text)}
#pkind.none{font-size:14px;font-weight:400;letter-spacing:0;color:var(--dim)}
.ftag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px;background:var(--warn);color:#000}
.pbar{position:relative;height:22px;background:#1c1c2c;border-radius:4px;overflow:hidden;margin-top:6px}
.pbar i{position:absolute;inset:0 auto 0 0;background:#0a5a6a;transition:width .1s linear}
.pbar span{position:relative;padding-left:8px;line-height:22px;font-size:12px}
.s16{display:flex;gap:8px;margin-top:10px}
.s16 div{flex:1;display:flex;gap:3px}
.s16 span{flex:1;height:12px;border-radius:2px;background:#1c1c2c}
.s16 span.past{background:#0a5a6a}
.s16 span.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
/* decks */
.decks{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.decks.withmix{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
@media(max-width:900px){.decks,.decks.withmix{grid-template-columns:1fr}}
.mixmid{display:flex;gap:4px;justify-content:center}
.deck{background:#0d0d16;border:1px solid var(--border);border-radius:8px;padding:10px}
.deck.master{border-color:var(--flash)}
.deck.vmaster{border-color:var(--accent)}
.deck .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.deck .name{font-weight:600}
.deck .bpm{color:var(--accent);font-variant-numeric:tabular-nums}
.deck .tag{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;background:#222236;color:var(--muted)}
.deck .tag.m{background:var(--flash);color:#000}.deck .tag.vm{background:var(--accent);color:#000}
.deck .tag.air{color:var(--play)}.deck .tag.sync{color:var(--accent)}
.deck .ps{color:var(--muted);margin-left:auto}
.deck .play{color:var(--play)}.deck .stopped{color:var(--dim)}
.deck .line{color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck .track{color:var(--accent)}
.deck .phrase{position:relative;height:16px;background:#1c1c2c;border-radius:3px;margin-top:6px;overflow:hidden}
.deck .phrase i{position:absolute;inset:0 auto 0 0;background:#0a5a6a}
.deck .phrase span{position:relative;font-size:11px;padding-left:6px;line-height:16px}
.deck canvas.wave{display:block;width:100%;height:56px;margin-top:6px;border-radius:3px;background:#08080d}
.deck canvas.wave.lane{height:74px}
.empty{color:var(--dim);padding:8px 0}
/* mixer: one channel strip next to its deck, with knobs */
.ch{display:flex;flex-direction:column;align-items:center;gap:2px;background:#0d0d16;border:1px solid var(--border);border-radius:8px;padding:6px 4px;width:62px}
.ch .chn{font-weight:600;font-size:11px;margin-bottom:2px}
.knob{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);line-height:1.1}
.knob svg{width:38px;height:38px;display:block}
.knob .trk{stroke:#2a2a40;stroke-width:4;fill:none;stroke-linecap:round}
.knob .val{stroke-width:4;fill:none;stroke-linecap:round}
.knob .ptr{stroke:var(--text);stroke-width:2;stroke-linecap:round}
.knob b{color:var(--text);font-weight:500}
.knob.kill b{color:var(--danger);font-weight:700}
.knob.unk{opacity:.35}
.fdr{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;margin-top:4px}
.fdr .track{position:relative;width:8px;height:56px;background:#1c1c2c;border-radius:4px;overflow:hidden}
.fdr .track i{position:absolute;left:0;right:0;bottom:0;background:var(--play)}
.fdr.unk{opacity:.35}
/* output */
.act{display:flex;gap:10px;min-height:20px;margin-top:6px}
.act .note{color:var(--flash);font-weight:700}.act .cc{color:var(--accent)}.act .osc{color:var(--play);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ooerr{color:var(--danger)}
/* firmware */
#fwerr{color:var(--danger)}
#fwbar{width:100%;height:6px;margin-top:6px}
/* settings */
.sgrid{columns:250px;column-gap:28px}
.group{break-inside:avoid;margin-bottom:8px}
.section{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:2px 0 3px;display:flex;align-items:center;gap:8px}
.section button{font-size:10px;padding:0 6px;letter-spacing:0;text-transform:none}
.set{display:flex;align-items:center;gap:4px;padding:1px 0;font-size:12px}
.set label{flex:1;color:var(--muted)}
.set .val{color:var(--text);text-align:right}
button{background:#1c1c2c;color:var(--text);border:1px solid var(--border);border-radius:5px;padding:1px 7px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.val{min-width:44px}
button.sw{min-width:22px;padding:1px 4px}
.set.off label,.set.off input{opacity:.45}
input.num{width:58px;background:#0d0d16;color:var(--text);border:1px solid var(--border);border-radius:5px;padding:1px 5px;text-align:right;font-size:12px}
input.num:focus{outline:none;border-color:var(--accent)}
input.num.bad{border-color:var(--danger)}
input.num.text{width:150px;text-align:left}
/* ports */
.ports{display:flex;flex-direction:column;gap:3px}
.port{text-align:left;display:flex;gap:8px}
.port.active{border-color:var(--play)}
.port .mark{width:10px;color:var(--play)}
/* logs */
.log{background:#08080d;border-radius:6px;padding:8px;height:200px;overflow-y:auto;font-size:11px;line-height:1.55;white-space:pre-wrap;word-break:break-all}
.log .ERROR{color:var(--danger)}.log .WARN{color:var(--warn)}.log .DEBUG,.log .TRACE{color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>xdj-clock</h1>
  <span class="kv"><span id="dot" class="dot"></span><span id="conn">connecting…</span></span>
  <span class="kv">source <b id="source">—</b></span>
  <span class="kv">mode <b id="mode">—</b></span>
  <span class="kv">iface <b id="iface">—</b></span>
  <b id="state" class="stop">■ STOP</b>
  <span id="toast"></span>
</header>
<main>
  <section class="panel">
    <h2>Master <span class="kv">deck <b id="mdeck">—</b></span></h2>
    <div class="mgrid">
      <div>
        <div id="bpm" class="num">---.-</div>
        <div id="beats" class="beats"><span></span><span></span><span></span><span></span></div>
        <div class="row">
          <span>pitch <b id="pitch" class="num">±0.00%</b></span>
        </div>
        <div class="row num">
          <span>in <b id="in16">00</b></span>
          <span>out <b id="out16">00</b></span>
          <span>Δ <b id="delta">—</b></span>
          <span>clock <b id="cstate">idle</b></span>
        </div>
      </div>
      <div>
        <div class="pk"><span id="pkind" class="none">—</span><span id="pfill" class="ftag" hidden>FILL</span></div>
        <div class="pbar"><i id="pprog" style="width:0"></i><span id="ppct" class="num"></span></div>
        <div class="row num">
          <span>beats left <b id="pleft">—</b></span>
          <span>bar <b id="pbar16">—</b></span>
        </div>
        <div id="s16" class="s16"></div>
      </div>
    </div>
  </section>

  <section class="panel" data-cap="output">
    <h2>Output Status</h2>
    <div class="row">port <b id="oport">—</b> <span id="oconn"></span></div>
    <div class="row">clock <b id="oclock">—</b> <span class="num">pulses <b id="opulses">0</b></span></div>
    <div class="row num">notes <b id="onotes">0</b> CCs <b id="occs">0</b> <span id="odropped"></span></div>
    <div class="row">MTC <b id="omtc">—</b></div>
    <div class="row">OSC <b id="oosc">—</b> <span id="oosctg" class="num"></span></div>
    <div class="row num" id="ooscn" hidden>sent <b id="oosent">0</b> <span id="ooerr"></span></div>
    <div class="act num"><span id="anote" class="note"></span><span id="acc" class="cc"></span><span id="aosc" class="osc"></span><span id="aidle" class="empty">idle</span></div>
  </section>

  <section class="panel wide" data-cap="decks">
    <h2>Deck Information <span id="link" class="kv"></span></h2>
    <div id="decks" class="decks"></div>
  </section>

  <details id="p-settings" class="panel wide" data-cap="settings" open>
    <summary><h2>Settings</h2></summary>
    <div id="sgrid" class="sgrid">
      <div id="set-input" class="group"><div class="section" title="Where the app gets the tempo and the beat.">Input</div></div>
      <div class="group" data-cap="ports">
        <div class="section" title="The MIDI port that gets all MIDI output. Click a port to use it.">Output Port <button id="rescan" title="Find the MIDI ports again.">Rescan</button></div>
        <div id="ports" class="ports"></div>
      </div>
    </div>
  </details>

  <details id="p-logs" class="panel wide" data-cap="logs" open>
    <summary><h2>Logs</h2></summary>
    <div id="log" class="log"></div>
  </details>

  <section class="panel wide" data-cap="ota">
    <h2>Firmware</h2>
    <div class="row">installed <b id="fwcur">—</b> <span id="fwstate" class="num"></span></div>
    <div class="row"><button id="fwcheck" title="Read the version of the latest release on GitHub. The box needs a network with internet.">Check for update</button> <button id="fwinstall" hidden></button></div>
    <progress id="fwbar" max="100" hidden></progress>
    <div class="row" id="fwerr"></div>
  </section>
</main>
<footer id="version"></footer>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const MIDI_SETTINGS_START = 3; // indices below this are the input settings
const LOG_MAX = 200;

/** Creates an element. Children are nodes or strings; strings become text nodes. */
function h(tag, cls, ...children) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const c of children) if (c !== null && c !== undefined && c !== false) e.append(c);
  return e;
}
const set = (id, text) => { const e = $(id); if (e.textContent !== text) e.textContent = text; };
const pad2 = (n) => String(n).padStart(2, '0');

let ws = null, backoff = 500, caps = null, status = null, beatCap = false, lastBeat = 0, toastTimer = 0;

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function toast(text) {
  set('toast', text);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => set('toast', ''), 4000);
}

function flash() {
  $('bpm').classList.add('flash'); $('beats').classList.add('flash');
  setTimeout(() => { $('bpm').classList.remove('flash'); $('beats').classList.remove('flash'); }, 100);
}

function onHello(m) {
  caps = new Set(m.caps || []);
  beatCap = caps.has('beat');
  set('version', 'v' + m.version + (m.device && m.device !== 'host' ? ' · ' + m.device : ''));
  set('fwcur', 'v' + m.version);
  document.querySelectorAll('[data-cap]').forEach((e) => { e.hidden = !caps.has(e.dataset.cap); });
}

function onStatus(s) {
  status = s;
  const m = s.master;
  set('source', s.source || '—');
  set('mode', s.mode || '—');
  set('iface', s.iface || '—');
  set('state', m.playing ? '▶ PLAY' : '■ STOP');
  $('state').className = m.playing ? 'play' : 'stop';

  set('bpm', m.bpm > 0 ? m.bpm.toFixed(2) : '---.-');
  [...$('beats').children].forEach((e, i) => e.classList.toggle('on', i + 1 === m.beat));
  if (!beatCap && m.beat !== lastBeat && m.beat > 0) flash();
  lastBeat = m.beat;
  set('pitch', Math.abs(m.pitch) < 0.005 ? '±0.00%' : (m.pitch > 0 ? '+' : '') + m.pitch.toFixed(2) + '%');
  set('mdeck', m.device ? '#' + m.device + (m.virtual_master ? ' (virtual)' : '') : (s.link_active ? 'Link' : '—'));
  set('in16', pad2(m.phrase16));
  renderPhrase(s);
  if (s.clock) {
    set('out16', pad2(s.clock.out16));
    set('delta', s.clock.delta_ms == null ? '—' : s.clock.delta_ms.toFixed(1) + 'ms');
    set('cstate', s.clock.state);
  }

  if (s.output) renderOutput(s.output);
  if (s.decks) renderDecks(s);
  if (s.ota) renderOta(s.ota);
}

const OTA_TEXT = { idle: '', checking: 'checking…', available: 'update available', 'up-to-date': 'up to date',
  downloading: 'downloading…', restarting: 'restarting for the install, about 1 min…', error: 'update failed' };

/** Shows the state of the firmware update. */
function renderOta(o) {
  const busy = o.state === 'checking' || o.state === 'downloading' || o.state === 'restarting';
  set('fwstate', (OTA_TEXT[o.state] || o.state) + (o.latest && o.state !== 'up-to-date' ? ' · v' + o.latest : ''));
  $('fwcheck').disabled = busy;
  $('fwinstall').hidden = o.state !== 'available';
  set('fwinstall', 'Install v' + (o.latest || '?'));
  $('fwbar').hidden = o.state !== 'downloading';
  $('fwbar').value = o.progress;
  set('fwerr', o.error || '');
}

$('fwcheck').onclick = () => send({ type: 'ota_check' });
$('fwinstall').onclick = () => {
  const playing = status && (status.decks || []).some((d) => d.playing);
  const warn = playing ? 'A deck plays. The MIDI clock can stutter during the download of about 30 s.\n\n' : '';
  if (confirm(warn + 'Install the new firmware? The box restarts after the download.')) send({ type: 'ota_install' });
};

/** Shows the phrase of the master deck and its position in the 16-beat phrase. */
function renderPhrase(s) {
  const m = s.master;
  const d = (s.decks || []).find((x) => x.num === m.device);
  const p = d && d.phrase;
  set('pkind', p ? p.kind : (d && d.phrase_note) || (m.device ? 'no phrase info' : '—'));
  $('pkind').classList.toggle('none', !p);
  $('pfill').hidden = !(p && p.fill);
  $('pprog').style.width = (p ? p.progress * 100 : 0) + '%';
  set('ppct', p ? Math.floor(p.progress * 100) + '%' : '');
  set('pleft', p && p.beats_left != null ? String(p.beats_left) : '—');
  set('pbar16', m.phrase16 ? Math.ceil(m.phrase16 / 4) + '/4' : '—');
  $('s16').querySelectorAll('span').forEach((e, i) => {
    const want = i + 1 < m.phrase16 ? 'past' : i + 1 === m.phrase16 ? 'on' : '';
    if (e.className !== want) e.className = want;
  });
}

function renderOutput(o) {
  set('oport', o.port || '—');
  set('oconn', o.connected ? '' : '(not connected)');
  set('oclock', o.clock_enabled ? '✓ enabled' : '✗ disabled');
  set('opulses', String(o.pulses));
  set('onotes', String(o.notes));
  set('occs', String(o.ccs));
  set('odropped', o.dropped ? 'dropped ' + o.dropped : '');
  set('omtc', o.mtc ? '✓ ' + o.mtc + ' (qf ' + o.mtc_qf + ', full ' + o.mtc_full + ')' : '✗ disabled');
  set('anote', o.last_note == null ? '' : '♪ note ' + o.last_note);
  set('acc', o.last_cc == null ? '' : '↗ CC' + o.last_cc[0] + '=' + o.last_cc[1]);
  const osc = o.osc;
  if (osc) {
    set('oosc', osc.enabled ? '✓ ' + osc.prefix : '✗ disabled');
    set('oosctg', osc.enabled ? (osc.targets.length ? '→ ' + osc.targets.join(', ') : 'no targets') : '');
    $('ooscn').hidden = !osc.enabled;
    set('oosent', String(osc.sent));
    set('ooerr', osc.errors ? 'errors ' + osc.errors : '');
  }
  set('aosc', osc && osc.last ? '⇢ ' + osc.last : '');
  $('aidle').hidden = o.last_note != null || o.last_cc != null || !!(osc && osc.last);
}

function fmtTime(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + pad2(s % 60); }

function renderDecks(s) {
  set('link', s.link_peers > 0 ? 'Ableton Link: ' + s.link_peers + ' peer(s)' + (s.link_active ? ' · active' : '') : (s.link_active ? 'Ableton Link active' : ''));
  // A device above 16 without a play state is a mixer or a computer, not a deck.
  const decks = s.decks.filter((d) => d.play_state != null || d.num <= 16);
  const cards = decks.map((d) => {
    const top = h('div', 'top',
      h('span', d.playing ? 'play' : 'stopped', d.playing ? '▶' : '■'),
      h('span', 'name', '#' + d.num + ' ' + d.name),
      d.master && h('span', 'tag m', 'MASTER'),
      d.virtual_master && h('span', 'tag vm', 'vM'),
      d.bpm != null && h('span', 'bpm num', d.bpm.toFixed(1) + ' bpm'),
      d.bpm != null && Math.abs(d.pitch) > 0.005 && h('span', 'num', '(' + (d.pitch > 0 ? '+' : '') + d.pitch.toFixed(2) + '%)'),
      d.play_state && h('span', 'ps', d.play_state));
    const flags = [];
    if (d.on_air) flags.push(h('span', 'tag air', 'ON-AIR'));
    if (d.sync) flags.push(h('span', 'tag sync', 'SYNC'));
    if (d.beat) flags.push('beat ' + [1, 2, 3, 4].map((i) => (i === d.beat ? '▮' : '▯')).join(''));
    if (d.beat_count != null) flags.push(' #' + d.beat_count);
    if (d.playhead_ms != null) flags.push(' ' + fmtTime(d.playhead_ms) + (d.track_len_ms ? ' / ' + fmtTime(d.track_len_ms) : ''));
    let phrase = null;
    if (d.phrase) {
      const bar = h('i'); bar.style.width = (d.phrase.progress * 100) + '%';
      phrase = h('div', 'phrase', bar, h('span', 'num', d.phrase.kind + ' ' + Math.floor(d.phrase.progress * 100) + '%' + (d.phrase.fill ? ' [FILL]' : '')));
    }
    const w = caps && caps.has('waveform') && (d.wave != null || d.track_len_ms != null) ? waveFor(d) : null;
    return h('div', 'deck' + (d.master ? ' master' : d.virtual_master ? ' vmaster' : ''),
      top,
      flags.length > 0 && h('div', 'line num', ...flags),
      d.track && h('div', 'line track', '♫ ' + d.track),
      d.src && h('div', 'line', 'src: ' + d.src),
      w && w.canvas,
      phrase,
      d.phrase_note && h('div', 'line', d.phrase_note));
  });
  if (cards.length === 0) cards.push(h('div', 'empty', s.no_devices ? 'No devices on network' : ''));
  // With a mixer, each row is: left deck, the two channel strips, right deck. Channel n belongs
  // to player n.
  const mx = s.mixer && (!caps || caps.has('mixer')) ? s.mixer : null;
  const items = [];
  if (mx && decks.length > 0) {
    for (let i = 0; i < cards.length; i += 2) {
      const strip = (d) => (d && d.num >= 1 && d.num <= mx.length ? stripFor(d.num - 1, mx[d.num - 1]) : null);
      items.push(cards[i], h('div', 'mixmid', strip(decks[i]), strip(decks[i + 1])), cards[i + 1] || h('div'));
    }
  } else items.push(...cards);
  $('decks').classList.toggle('withmix', items.length !== cards.length);
  // The cards are new on each status. The canvas and the strip of a deck move into the new row.
  $('decks').replaceChildren(...items);
  for (const d of decks) { const w = waves.get(d.num); if (w && w.canvas.isConnected) drawWave(w, d); }
}

// The waveform of each deck: {canvas, id, img, cues, phrases}. `id` is the rekordbox ID of `img`.
const waves = new Map();
// The phrase lane colours, by the first word of the phrase kind.
const PHRASE_COLOURS = { INTRO: '#3f6ea8', VERSE: '#7357a8', BRIDGE: '#a8853a', CHORUS: '#b5425a', UP: '#38996d', DOWN: '#357fa3', OUTRO: '#3f6ea8' };

function waveFor(d) {
  let w = waves.get(d.num);
  if (!w) { w = { canvas: h('canvas', 'wave'), id: null, img: null, cues: [], phrases: [] }; waves.set(d.num, w); }
  if ((d.wave ?? null) !== w.id) {
    w.id = d.wave ?? null; w.img = null; w.cues = []; w.phrases = [];
    w.canvas.classList.remove('lane');
    if (w.id != null) {
      const want = w.id;
      fetch('/waveform/' + d.num).then((r) => (r.ok ? r.json() : null)).then((j) => {
        if (!j || j.rekordbox_id !== want || w.id !== want) return;
        w.img = j.preview && j.preview.length ? renderPreview(j.preview) : null;
        w.cues = j.cues || [];
        w.phrases = j.phrases || [];
        w.canvas.classList.toggle('lane', w.phrases.length > 0);
      }).catch(() => { /* the next track change tries again */ });
    }
  }
  return w;
}

/**
 * Draws the PWV4 columns once into an offscreen canvas, with the Beat Link RGB colours.
 * Bytes 3, 4 and 5 of a column are the red, green and blue levels. The back height is the
 * largest level, the front height is the blue level. The highest column of the track sets the
 * scale, as in Beat Link `WaveformPreview.getMaxHeight`.
 */
function renderPreview(b) {
  const n = Math.floor(b.length / 6);
  let top = 1;
  for (let i = 0; i < n; i++) top = Math.max(top, b[i * 6 + 3], b[i * 6 + 4], b[i * 6 + 5]);
  const c = document.createElement('canvas');
  c.width = Math.max(n, 1); c.height = top;
  const g = c.getContext('2d');
  for (let i = 0; i < n; i++) {
    const r = b[i * 6 + 3], gr = b[i * 6 + 4], bl = b[i * 6 + 5];
    const back = Math.max(r, gr, bl), front = bl;
    if (back === 0) continue;
    const col = (max) => 'rgb(' + [r, gr, bl].map((v) => Math.round(v * max / back)).join(',') + ')';
    g.fillStyle = col(191); g.fillRect(i, top - back, 1, back);
    g.fillStyle = col(255); g.fillRect(i, top - front, 1, front);
  }
  return c;
}

/** Draws the phrase blocks with their names. The phrase under the playhead is brighter. */
function drawPhrases(g, phrases, x, y, hgt, dpr, playhead) {
  g.font = (10 * dpr) + 'px -apple-system,sans-serif'; g.textBaseline = 'middle';
  for (const p of phrases) {
    const x0 = x(p.start), x1 = x(p.end), wd = Math.max(x1 - x0 - dpr, 1);
    const now = playhead != null && playhead >= p.start && playhead < p.end;
    g.globalAlpha = now ? 1 : 0.6;
    g.fillStyle = PHRASE_COLOURS[p.kind.split(' ')[0]] || '#555';
    g.fillRect(x0, y + dpr, wd, hgt - dpr);
    if (p.fill != null) { g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x(p.fill), y + dpr, Math.max(x1 - x(p.fill) - dpr, 1), hgt - dpr); }
    g.globalAlpha = 1;
    const label = p.kind.replace('VERSE ', 'V');
    if (g.measureText(label).width + 6 * dpr < wd) { g.fillStyle = '#fff'; g.fillText(label, x0 + 3 * dpr, y + hgt / 2 + dpr / 2); }
  }
}

/** Draws the waveform, the stored cues and loops, the active loop and the playhead. */
function drawWave(w, d) {
  const dpr = window.devicePixelRatio || 1;
  const W = Math.round(w.canvas.clientWidth * dpr), H = Math.round(w.canvas.clientHeight * dpr);
  if (!W || !H) return;
  if (w.canvas.width !== W) w.canvas.width = W;
  if (w.canvas.height !== H) w.canvas.height = H;
  const g = w.canvas.getContext('2d');
  g.clearRect(0, 0, W, H);
  // The phrase lane is the bottom 18 px. The waveform takes the rest.
  const laneH = w.phrases.length ? Math.round(18 * dpr) : 0;
  const WH = H - laneH;
  if (w.img) g.drawImage(w.img, 0, 0, W, WH);
  const len = d.track_len_ms;
  if (!len) return;
  const x = (ms) => Math.round(ms / len * W);
  if (laneH) drawPhrases(g, w.phrases, x, WH, laneH, dpr, d.playhead_ms);
  for (const c of w.cues) {
    if (c.end != null) { g.fillStyle = 'rgba(255,170,0,.22)'; g.fillRect(x(c.start), 0, Math.max(x(c.end) - x(c.start), 1), WH); }
  }
  if (d.loop_ms) {
    const [a, b] = d.loop_ms;
    g.fillStyle = 'rgba(255,208,0,.35)'; g.fillRect(x(a), 0, Math.max(x(b) - x(a), 2 * dpr), WH);
    g.fillStyle = '#ffd000'; g.fillRect(x(a), 0, dpr, WH); g.fillRect(x(b) - dpr, 0, dpr, WH);
  }
  g.font = (9 * dpr) + 'px sans-serif'; g.textBaseline = 'top';
  for (const c of w.cues) {
    const cx = x(c.start);
    g.fillStyle = c.hot ? '#00ff88' : '#ff4d4d';
    g.fillRect(cx, 0, dpr, WH);
    if (c.hot) g.fillText(String.fromCharCode(64 + c.hot), cx + 2 * dpr, 1);
    else { g.beginPath(); g.moveTo(cx - 3 * dpr, 0); g.lineTo(cx + 4 * dpr, 0); g.lineTo(cx + dpr / 2, 5 * dpr); g.fill(); }
  }
  if (d.playhead_ms != null) {
    g.fillStyle = '#fff';
    g.fillRect(Math.min(x(d.playhead_ms), W - 2 * dpr), 0, 2 * dpr, H);
  }
}

// The channel strips are built once per channel, then moved into each new deck row.
const strips = [];
const SVGNS = 'http://www.w3.org/2000/svg';
const svg = (tag, cls) => { const e = document.createElementNS(SVGNS, tag); if (cls) e.setAttribute('class', cls); return e; };

/** The point at `deg` degrees clockwise from the top, on a circle of radius r around (19, 19). */
const knobPt = (deg, r) => { const a = deg * Math.PI / 180; return [19 + r * Math.sin(a), 19 - r * Math.cos(a)]; };
/** An SVG arc from a0 to a1 degrees, clockwise from the top. */
function arc(a0, a1, r) {
  const [x0, y0] = knobPt(Math.min(a0, a1), r), [x1, y1] = knobPt(Math.max(a0, a1), r);
  return 'M' + x0 + ' ' + y0 + 'A' + r + ' ' + r + ' 0 ' + (Math.abs(a1 - a0) > 180 ? 1 : 0) + ' 1 ' + x1 + ' ' + y1;
}

function buildKnob(band) {
  const s = svg('svg'); s.setAttribute('viewBox', '0 0 38 38');
  const trk = svg('path', 'trk'); trk.setAttribute('d', arc(-135, 135, 14));
  const val = svg('path', 'val'), ptr = svg('line', 'ptr');
  ptr.setAttribute('x1', 19); ptr.setAttribute('y1', 19);
  s.append(trk, val, ptr);
  const txt = h('b', null, '—');
  return { band, el: h('div', 'knob', s, h('span', null, band.toUpperCase() + ' ', txt)), val, ptr, txt };
}

/**
 * Shows an EQ offset (-64 to +63, centre 0) as a knob: -135° is full cut, +135° is full boost.
 * -64 is a kill.
 */
function setKnob(k, v) {
  const unk = v == null, kill = !unk && v <= -64;
  const deg = unk ? 0 : (v > 0 ? v / 63 : v / 64) * 135;
  k.el.classList.toggle('unk', unk);
  k.el.classList.toggle('kill', kill);
  k.val.setAttribute('d', unk || v === 0 ? '' : arc(0, deg, 14));
  k.val.style.stroke = kill ? 'var(--danger)' : v > 0 ? 'var(--accent)' : 'var(--warn)';
  const [px, py] = knobPt(deg, 9);
  k.ptr.setAttribute('x2', px); k.ptr.setAttribute('y2', py);
  k.txt.textContent = unk ? '—' : kill ? 'KILL' : (v > 0 ? '+' : '') + v;
}

function stripFor(i, c) {
  let st = strips[i];
  if (!st) {
    const knobs = ['hi', 'mid', 'low'].map(buildKnob);
    const fbar = h('i'), fval = h('span', 'num'), fdr = h('div', 'fdr', h('div', 'track', fbar), fval);
    st = strips[i] = { el: h('div', 'ch', h('div', 'chn', 'CH' + (i + 1)), ...knobs.map((k) => k.el), fdr), knobs, fbar, fval, fdr };
  }
  for (const k of st.knobs) setKnob(k, c[k.band]);
  st.fdr.classList.toggle('unk', c.fader_pct == null);
  st.fbar.style.height = (c.fader_pct ?? 0) + '%';
  st.fval.textContent = c.fader_pct == null ? '—' : c.fader_pct + '%';
  return st.el;
}

// The tooltip of each settings row and section, by label.
const HELP = {
  'MIDI Clock': 'MIDI clock: 24 pulses per beat, with Start and Stop. A DAW or a drum machine can follow it.',
  'MIDI Notes': 'Short notes on beats and phrase events. Use them to trigger clips, samples or lights.',
  'MIDI CC': 'Control Change messages with the tempo, the phase and the state of the master deck.',
  'MIDI Timecode': 'MIDI Timecode (MTC) for apps that follow a time position.',
  'OSC Output': 'Open Sound Control over UDP to lighting desks and media servers.',
  'Network Interface': 'The network port that gets the Pro DJ Link packets from the players. Click to select the next port.',
  'Source Mode': 'The source of the tempo and the beat. Auto uses Ableton Link when a Link peer is present. If not, it uses Pro DJ Link.',
  'Device Number': 'The player number (1–15) of this app on Pro DJ Link. Use a number that no player uses. After a change, the app joins the network again with the new number.',
  'Clock Enabled': 'Sends MIDI clock, Start and Stop on the output port.',
  'Clock Loop Sync': 'Locks the clock to the phrases of the master deck. After a resume, the clock waits for the next phrase start before it sends Start.',
  'BPM Smoothing': 'The time in ms in which the clock follows a tempo change. A higher value gives less jitter but a slower response. 0 follows at once.',
  'Latency Comp': 'Moves the clock pulses later (positive) or earlier (negative), in ms. Use it to align the clock with the sound.',
  'Phrase Lock Stable': 'The number of bars between two full resyncs of the clock to the beat.',
  'Notes Enabled': 'Sends the MIDI notes below. When off, the app sends no note.',
  'Note Channel': 'The MIDI channel (1–16) of all notes.',
  'Beat Note': 'The note on each beat. The velocity is 127 on beat 1, 64 on beat 3 and 80 on beats 2 and 4.',
  'Downbeat Note': 'The note on beat 1 of each bar.',
  'Phrase Change Note': 'The note when the phrase of the master deck changes.',
  'Phrase Kind Base Note': 'The first note of the phrase kinds. At each new phrase, the app sends this note plus the kind code: Intro 0, Verse 1–6, Bridge 7, Chorus 8, Up 9, Down 10, Outro 11. The maximum is 116.',
  'No Bass Note': 'The note when the bass is cut on all live XDJ-AZ mixer channels. The note comes again when the bass comes back.',
  'CC Enabled': 'Sends the MIDI CC messages below. When off, the app sends no CC.',
  'CC Channel': 'The MIDI channel (1–16) of all CC messages.',
  'BPM Coarse CC': 'The tempo in whole BPM: 60 BPM is 0 and 187 BPM is 127.',
  'BPM Fine CC': 'The fraction of the tempo: .00 BPM is 0 and .99 BPM is 127.',
  'Pitch CC': 'The pitch of the master deck: −10 % is 0, 0 % is 64 and +10 % is 127.',
  'Bar Phase CC': 'The position in the bar: 0 on beat 1, up to 127 at the end of the bar.',
  'Beat Phase CC': 'The position in the beat: 0 on the beat, up to 127 at the end of the beat.',
  'Playing CC': '127 when the master deck plays, 0 when it stops.',
  'Master Deck CC': 'The player number of the tempo master. 0 is no master.',
  'Phrase 16 CC': 'Sends 0 at the start of each 16-beat block.',
  'Phrase Kind CC': 'The phrase kind of the master deck times 10: Intro 0, Verse 10–60, Bridge 70, Chorus 80, Up 90, Down 100, Outro 110.',
  'Phrase Progress CC': 'The position in the current phrase of the master deck: 0 at the start, 127 at the end.',
  'Beats Left CC': 'The number of beats to the end of the current phrase of the master deck. The maximum is 127.',
  'MTC Enabled': 'Sends MIDI Timecode on the output port.',
  'MTC Frame Rate': 'The MTC frame rate: 24, 25 or 30 fps. The receiver must use the same rate.',
  'OSC Enabled': 'Sends OSC messages to the targets below.',
  'OSC Targets': 'The receivers as IP:port, with commas between them. A broadcast address is permitted.',
  'OSC Prefix': 'The text before each OSC address. For example, /xdj gives /xdj/beat. It must start with /.',
  'Join WiFi name (applies after restart)': 'An existing WiFi network that the device joins. The page is then also at http://xdj-clock.local and at the address on the iface line. The own WiFi network stays on. Clear the name to stop the join.',
  'Join WiFi password (applies after restart)': 'The password of the network to join. For an open network, clear the name, then set it again without a password.',
};

// Settings rows are built once per index, then updated in place, so that an input keeps its focus.
// Each section is a group that the columns of #sgrid do not split.
const setRows = new Map();
let group = null, groupName = null;
function onSettings(m) {
  for (const it of m.items) {
    let row = setRows.get(it.idx);
    if (!row) {
      let parent = $('set-input');
      if (it.idx >= MIDI_SETTINGS_START) {
        if (!group || (it.section && it.section !== groupName)) {
          groupName = it.section || 'MIDI';
          const head = h('div', 'section', groupName);
          head.title = HELP[groupName] || '';
          group = h('div', 'group', head);
          $('sgrid').append(group);
        }
        parent = group;
      }
      row = buildSetting(it);
      row.el.title = HELP[it.label] || '';
      setRows.set(it.idx, row);
      parent.append(row.el);
    }
    row.update(it);
  }
}

function buildSetting(it) {
  const label = h('label', null, it.label);
  if (it.kind === 'number' || it.kind === 'text') {
    const input = h('input', it.kind === 'text' ? 'num text' : 'num');
    input.inputMode = it.kind === 'text' ? 'text' : 'numeric';
    const commit = () => {
      const value = input.value.trim();
      if (value === input.dataset.raw) return;
      // Enter commits, then blur fires "change": the raw value stops the second send.
      input.dataset.raw = value;
      send({ type: 'set', idx: it.idx, value });
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { commit(); input.blur(); }
      if (e.key === 'Escape') { input.value = input.dataset.raw; input.blur(); }
    });
    input.addEventListener('change', commit);
    const shown = h('span', 'val num');
    const parts = [label];
    // A note or CC has a switch. The server sends its state as "on".
    const sw = 'on' in it ? h('button', 'sw', '') : null;
    if (sw) {
      sw.title = 'Click to switch this message on or off.';
      sw.addEventListener('click', () => send({ type: 'cycle', idx: it.idx, dir: 1 }));
      parts.push(sw);
    }
    parts.push(shown);
    if (it.step) {
      for (const [text, dir] of [['◀', -1], ['▶', 1]]) {
        const b = h('button', null, text);
        b.addEventListener('click', () => send({ type: 'cycle', idx: it.idx, dir }));
        parts.push(b);
      }
    }
    parts.push(input);
    const el = h('div', 'set', ...parts);
    return {
      el,
      update(it) {
        if (sw) { sw.textContent = it.on ? '✓' : '✗'; el.classList.toggle('off', !it.on); }
        input.dataset.raw = it.raw ?? '';
        // The shown value carries the unit; the input holds the raw number.
        // A hidden value (a password) has no raw value. Its mask goes in the input as a placeholder.
        input.placeholder = it.raw == null ? it.value : '';
        shown.textContent = it.value === it.raw || it.raw == null ? '' : it.value;
        if (document.activeElement !== input) { input.value = it.raw ?? ''; input.classList.remove('bad'); }
      },
    };
  }
  const val = h('button', 'val', '');
  val.addEventListener('click', (e) => send({ type: 'cycle', idx: it.idx, dir: e.shiftKey ? -1 : 1 }));
  const parts = [label];
  if (it.kind === 'cycle') {
    const prev = h('button', null, '◀');
    prev.addEventListener('click', () => send({ type: 'cycle', idx: it.idx, dir: -1 }));
    parts.push(prev);
  }
  parts.push(val);
  return { el: h('div', 'set', ...parts), update(it) { val.textContent = it.value; } };
}

function onPorts(m) {
  const items = m.ports.map((name, index) => {
    const active = name === m.active;
    const b = h('button', 'port' + (active ? ' active' : ''), h('span', 'mark', active ? '●' : ''), name);
    // The index selects among ports with the same name.
    b.addEventListener('click', () => send({ type: 'port', name, index }));
    return b;
  });
  if (!m.ports.includes(m.active) && m.active) {
    items.unshift(h('div', 'empty', 'configured: ' + m.active + (m.connected ? '' : ' (not connected)')));
  }
  if (items.length === 0) items.push(h('div', 'empty', 'No MIDI ports found'));
  $('ports').replaceChildren(...items);
}

function logLevel(line) {
  // "  12.3s  INFO target: msg": the level is the second word.
  const w = line.trim().split(/\s+/)[1] || '';
  return ['ERROR', 'WARN', 'INFO', 'DEBUG', 'TRACE'].includes(w) ? w : 'INFO';
}

function onLog(m) {
  const box = $('log');
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
  for (const line of m.lines) box.append(h('div', logLevel(line), line));
  while (box.childElementCount > LOG_MAX) box.firstElementChild.remove();
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function onBeat(m) {
  if (!status) return;
  const master = status.master.device;
  if (m.device === master || (m.device === 0 && status.link_active)) flash();
}

const handlers = { hello: onHello, status: onStatus, settings: onSettings, ports: onPorts, log: onLog, beat: onBeat, error: (m) => toast(m.text) };

function connect() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/ws');
  ws.onopen = () => {
    backoff = 500;
    $('dot').classList.add('on');
    set('conn', 'live');
    // The server sends all retained log lines to a new socket.
    $('log').replaceChildren();
  };
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    const f = handlers[m.type];
    if (f) f(m);
  };
  ws.onclose = () => {
    $('dot').classList.remove('on');
    set('conn', 'reconnecting…');
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 5000);
  };
}

$('rescan').addEventListener('click', () => send({ type: 'rescan' }));

// The 16-beat phrase strip: four bars of four beats.
for (let bar = 0; bar < 4; bar++) $('s16').append(h('div', null, h('span'), h('span'), h('span'), h('span')));

// A collapsed panel stays collapsed after a reload.
document.querySelectorAll('details.panel').forEach((d) => {
  const key = 'xdj-clock.open.' + d.id;
  try {
    const saved = localStorage.getItem(key);
    if (saved !== null) d.open = saved === '1';
  } catch { /* storage blocked: keep the default */ }
  d.addEventListener('toggle', () => {
    try { localStorage.setItem(key, d.open ? '1' : '0'); } catch { /* ignore */ }
  });
});

connect();
</script>

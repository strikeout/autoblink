name: ESP32 CI

# The firmware build takes about 5 minutes. It runs after a merge to main and on a manual start.
# Before a push, `sh scripts/check.sh` builds the firmware with and without the DMX feature.
on:
  push:
    branches: [main]
    paths: ["esp32/**", "crates/**", "webui/**", ".github/workflows/esp32-ci.yml"]
  workflow_dispatch:

concurrency:
  group: esp32-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  esp32-build:
    name: Build ESP32 firmware (WT32-ETH01)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # espup reads the latest toolchain version from the GitHub API. Without a token, the API
      # allows 60 requests in an hour for each runner address, and it then returns 403.
      - name: Install the Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32
          ldproxy: false

      # The toolchain action downloads ldproxy with curl and no retry. GitHub sometimes gives
      # "Not Found" for that download, and then the build stops. This step downloads a pinned
      # version with retries. If the download fails, the step builds ldproxy from source.
      - name: Install ldproxy
        run: |
          url=https://github.com/esp-rs/embuild/releases/download/ldproxy-v0.3.2/ldproxy-x86_64-unknown-linux-gnu.zip
          if curl -fsSL --retry 5 --retry-all-errors -o ldproxy.zip "$url" && unzip -o ldproxy.zip -d "$HOME/.cargo/bin"; then
            chmod +x "$HOME/.cargo/bin/ldproxy"*
          else
            cargo install ldproxy --locked
          fi

      - name: Cache ESP-IDF and Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.cargo/registry
            esp32/target
          key: esp32-${{ hashFiles('esp32/Cargo.lock', 'esp32/.cargo/config.toml', 'esp32/sdkconfig.defaults') }}

      - name: Build
        working-directory: esp32
        run: cargo build --release --locked

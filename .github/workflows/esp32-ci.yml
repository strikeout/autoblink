name: ESP32 CI

on:
  push:
    branches: [main]
    paths: ["esp32/**", "crates/**", "webui/**", ".github/workflows/esp32-ci.yml"]
  pull_request:
    paths: ["esp32/**", "crates/**", "webui/**", ".github/workflows/esp32-ci.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  esp32-build:
    name: Build ESP32 firmware (WT32-ETH01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32
          ldproxy: true

      - name: Cache ESP-IDF and Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.cargo/registry
            esp32/target
          key: esp32-${{ hashFiles('esp32/Cargo.lock', 'esp32/.cargo/config.toml', 'esp32/sdkconfig.defaults') }}

      - name: Build with the DMX output
        working-directory: esp32
        run: cargo build --release --locked --features dmx

      - name: Build
        working-directory: esp32
        run: cargo build --release --locked

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: esp32/target/xtensa-esp32-espidf/release/xdj-clock-esp32

name: ESP32 Release

on:
  push:
    tags:
      - 'esp32-v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-esp32-release:
    name: Build ESP32 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32
          ldproxy: false

      # The toolchain action downloads ldproxy with curl and no retry. GitHub sometimes gives
      # "Not Found" for that download, and then the build stops. This step downloads a pinned
      # version with retries. If the download fails, the step builds ldproxy from source.
      - name: Install ldproxy
        run: |
          url=https://github.com/esp-rs/embuild/releases/download/ldproxy-v0.3.2/ldproxy-x86_64-unknown-linux-gnu.zip
          if curl -fsSL --retry 5 --retry-all-errors -o ldproxy.zip "$url" && unzip -o ldproxy.zip -d "$HOME/.cargo/bin"; then
            chmod +x "$HOME/.cargo/bin/ldproxy"*
          else
            cargo install ldproxy --locked
          fi

      - name: Install espflash
        uses: taiki-e/install-action@v2
        with:
          tool: espflash

      # The box compares the release version with its own version. A mismatch makes it install
      # the same firmware again after each check.
      - name: Check the tag against the firmware version
        run: |
          tag="${{ github.ref_name }}"
          version=$(grep -m1 '^version' esp32/Cargo.toml | cut -d'"' -f2)
          if [ "${tag#esp32-v}" != "$version" ]; then
            echo "The tag $tag does not match the version $version in esp32/Cargo.toml"
            exit 1
          fi

      - name: Build ESP32 firmware
        working-directory: esp32
        run: cargo build --release --locked

      - name: Prepare release package
        run: |
          mkdir -p esp32-release
          elf=esp32/target/xtensa-esp32-espidf/release/xdj-clock-esp32
          cp "$elf" esp32-release/
          # One image with the bootloader and the partition table. Write it at address 0x0.
          espflash save-image --chip esp32 --merge \
            --bootloader esp32/target/xtensa-esp32-espidf/release/bootloader.bin \
            --partition-table esp32/partitions.csv \
            "$elf" esp32-release/xdj-clock-esp32-merged.bin
          # The app image without the bootloader. The box downloads it for an OTA update.
          espflash save-image --chip esp32 "$elf" esp32-release/xdj-clock-esp32-ota.bin
          tag="${{ github.ref_name }}"
          echo "${tag#esp32-v}" > esp32-release/esp32-version.txt
          tar -czf esp32-firmware.tar.gz esp32-release/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-${{ github.ref_name }}
          path: esp32-firmware.tar.gz

  release:
    name: Create GitHub Release
    needs: build-esp32-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          files=$(find artifacts -type f | tr '\n' ' ')
          # The host release stays the latest release of the repository.
          gh release create "$tag" \
            --title "xdj-clock ESP32 $tag" \
            --notes "ESP32 firmware release" \
            --latest=false \
            $files

      # The box reads the version and the image from the fixed release esp32-latest.
      - name: Update the esp32-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -xzf artifacts/*/esp32-firmware.tar.gz
          if ! gh release view esp32-latest > /dev/null 2>&1; then
            gh release create esp32-latest --prerelease --latest=false \
              --title "xdj-clock ESP32 OTA" \
              --notes "The ESP32 box downloads its firmware updates from this release."
          fi
          gh release upload esp32-latest --clobber \
            esp32-release/esp32-version.txt esp32-release/xdj-clock-esp32-ota.bin
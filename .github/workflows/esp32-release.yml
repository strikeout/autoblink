name: ESP32 Release

on:
  push:
    tags:
      - 'esp32-v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-esp32-release:
    name: Build ESP32 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32
          ldproxy: true

      - name: Install espflash
        uses: taiki-e/install-action@v2
        with:
          tool: espflash

      - name: Build ESP32 firmware
        working-directory: esp32
        run: cargo build --release --locked

      - name: Prepare release package
        run: |
          mkdir -p esp32-release
          elf=esp32/target/xtensa-esp32-espidf/release/xdj-clock-esp32
          cp "$elf" esp32-release/
          # One image with the bootloader and the partition table. Write it at address 0x0.
          espflash save-image --chip esp32 --merge "$elf" esp32-release/xdj-clock-esp32-merged.bin
          tar -czf esp32-firmware.tar.gz esp32-release/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-${{ github.ref_name }}
          path: esp32-firmware.tar.gz

  release:
    name: Create GitHub Release
    needs: build-esp32-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          files=$(find artifacts -type f | tr '\n' ' ')
          gh release create "$tag" \
            --title "xdj-clock ESP32 $tag" \
            --notes "ESP32 firmware release" \
            $files
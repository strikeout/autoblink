[workspace]
resolver = "2"
members = [
  "host",
  "esp32-emulator",
  "crates/xdj-core-prolink",
]

# The firmware builds with the Xtensa toolchain and its own target. It has its own
# Cargo.lock and its own target directory in `esp32/`.
exclude = ["esp32"]

[workspace.package]
version = "1.12.0"
edition = "2021"
license = "Proprietary"
authors = ["xdj-midi team"]

[profile.release]
lto = true
codegen-units = 1

[patch.crates-io]
rusty_link = { path = "vendor/rusty_link" }

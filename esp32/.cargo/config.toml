[build]
target = "xtensa-esp32-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
# Run `cargo run --release` in esp32/. The runner flashes the bootloader of this build and the
# OTA partition table. It erases otadata, so that the board starts the new app in ota_0.
runner = "espflash flash --monitor --bootloader target/xtensa-esp32-espidf/release/bootloader.bin --partition-table partitions.csv --erase-parts otadata"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.5.3"
# All checkouts share one ESP-IDF install in ~/.espressif.
ESP_IDF_TOOLS_INSTALL_DIR = "global"
ESP_IDF_SDKCONFIG_DEFAULTS = "sdkconfig.defaults"

[package]
name = "xdj-clock-esp32"
# The firmware is not in the workspace. Keep this version the same as the workspace version.
version = "1.21.1"
edition = "2021"
license = "Proprietary"
authors = ["xdj-midi team"]
rust-version = "1.82"

[[bin]]
name = "xdj-clock-esp32"
harness = false

[profile.release]
opt-level = "s"
# One codegen unit and full LTO make the image smaller. The firmware has no unwinding.
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
opt-level = "z"

[features]
# DMX512 output on IO4. It is off until the DMX behaviour is decided.
dmx = []

[dependencies]
anyhow = "1"
esp-idf-svc = "0.53"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xdj-core-dbserver = { path = "../crates/xdj-core-dbserver" }
xdj-core-midi = { path = "../crates/xdj-core-midi" }
xdj-core-prolink = { path = "../crates/xdj-core-prolink" }

[build-dependencies]
embuild = "0.33.5"
# build.rs compresses the web page with gzip.
flate2 = "1"

# ESP-IDF 5 has mDNS as an external component. It gives the name xdj-clock.local.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }

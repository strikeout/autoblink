[package]
name = "autoblink-esp32"
# The firmware is not in the workspace. Keep this version the same as the workspace version.
version = "1.25.0"
edition = "2021"
license = "Proprietary"
authors = ["AUTOBLINK team"]
rust-version = "1.82"

[[bin]]
name = "autoblink-esp32"
harness = false

[profile.release]
opt-level = "s"
# One codegen unit and full LTO make the image smaller. The firmware has no unwinding.
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
opt-level = "z"

[features]
# The DMX512 output on IO4 (dmx.rs). It is on by default.
default = ["dmx"]
dmx = []

[dependencies]
anyhow = "1"
esp-idf-svc = "0.53"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
autoblink-core-dbserver = { path = "../crates/autoblink-core-dbserver" }
autoblink-core-dmx = { path = "../crates/autoblink-core-dmx" }
autoblink-core-midi = { path = "../crates/autoblink-core-midi" }
autoblink-core-prolink = { path = "../crates/autoblink-core-prolink" }

[build-dependencies]
embuild = "0.33.5"
# build.rs compresses the web page with gzip.
flate2 = "1"

# ESP-IDF 5 has mDNS as an external component. It gives the name autoblink.local.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }

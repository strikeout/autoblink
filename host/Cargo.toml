[package]
name = "autoblink-host"
version.workspace = true
edition.workspace = true
default-run = "autoblink"
license.workspace = true

[[bin]]
name = "autoblink"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
socket2 = "0.6"
parking_lot = "0.12"
midir = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
network-interface = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
serde_json = "1"

rusty_link = "0.2"
autoblink-core-midi = { path = "../crates/autoblink-core-midi" }
autoblink-core-prolink = { path = "../crates/autoblink-core-prolink" }

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = "0.3"
